<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practica de Cabeceras</title>
<meta name="description" content="Practica interactiva para memorizar de memoria los campos de las cabeceras TCP, UDP, IPv4 y Ethernet, rellenando diagramas proporcionales por bits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="wrap">

  <div class="top">
    <div>
      <div class="eyebrow">PAX &middot; T1 &middot; R1</div>
      <h1>Practica de Cabeceras</h1>
      <div class="subtitle">Rellena los campos de memoria, como en el dibujo del examen.</div>
    </div>
    <div class="stat-badge">
      <span id="stat-text">0 aciertos / 0 intentos</span>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist"></div>

  <div class="card">
    <div class="header-meta">
      <div>
        <h2 class="header-title" id="header-title"></h2>
        <div class="header-size" id="header-size"></div>
      </div>
      <div class="legend">
        <span class="legend-item"><i class="dot given"></i>dado</span>
        <span class="legend-item"><i class="dot blank"></i>a rellenar</span>
      </div>
    </div>

    <div class="diagram" id="diagram"></div>

    <div class="actions">
      <button class="btn" id="check-btn">Revisar</button>
      <button class="btn ghost" id="reveal-btn">Ver clave</button>
      <button class="btn ghost" id="shuffle-btn">Nueva practica</button>
    </div>

    <div class="result-msg" id="result-msg" hidden></div>

    <div class="weak-panel" id="weak-panel" hidden>
      <div class="weak-head">
        <span class="weak-title">Tus puntos debiles en esta cabecera</span>
        <button class="btn ghost small" id="drill-weak-btn">Reforzar estos campos</button>
      </div>
      <div class="weak-list" id="weak-list"></div>
    </div>
  </div>

  <div class="card ref-card">
    <h3 class="ref-title">Referencia rapida de tamanos</h3>
    <div class="ref-grid">
      <div class="ref-item"><span class="ref-proto">TCP</span><span class="ref-size">20 - 60 bytes</span></div>
      <div class="ref-item"><span class="ref-proto">UDP</span><span class="ref-size">8 bytes</span></div>
      <div class="ref-item"><span class="ref-proto">IPv4</span><span class="ref-size">20 - 60 bytes</span></div>
      <div class="ref-item"><span class="ref-proto">Ethernet</span><span class="ref-size">64 - 1518 bytes</span></div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
